services:
  backend:
    build: ./Backend
    ports:
      - "3000:3000"
    environment:
      - GOOGLE_ID=${GOOGLE_ID}
      - MONGODB_ID=${MONGODB_ID}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NODE_ENV=development
    networks:
      - app-network

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_GOOGLE_ID: ${VITE_GOOGLE_ID}
        VITE_HUGGINGFACE_ID: ${VITE_HUGGINGFACE_ID}
        VITE_API_URL: "http://localhost:3000" 
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        VITE_GOOGLE_ID: ${VITE_GOOGLE_ID}
        VITE_HUGGINGFACE_ID: ${VITE_HUGGINGFACE_ID}
        VITE_API_URL: "http://localhost:3000"
    environment:
      - GOOGLE_ID=${GOOGLE_ID}
      - MONGODB_ID=${MONGODB_ID}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - TZ=America/Los_Angeles
      - DOCKER=true
    volumes:
      - ./test-results:/app/test-results
    networks:
      - app-network

networks:
  app-network:
    driver: bridge